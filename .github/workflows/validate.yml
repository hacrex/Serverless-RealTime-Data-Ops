name: Validate Serverless Data Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -m json.tool schemas/event-envelope.v1.json > /dev/null
      - run: bash -n scripts/send-sample-event.sh
